name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: ZIP Dosyasini Otomatik Ac
        run: |
          if [ -f "yks_sayisal_takip_proje_2.zip" ]; then
            unzip -o yks_sayisal_takip_proje_2.zip
          fi

      - name: Java (JDK 17) Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android Dosyalarini, Desugaring ve Izinleri Yapilandir
        run: |
          flutter create --platforms=android --org com.yks.sayisal .
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>\n    <application/' "$MANIFEST"
          fi

          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "coreLibraryDesugaring" "$BUILD_GRADLE"; then
              sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/' "$BUILD_GRADLE"
              sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' "$BUILD_GRADLE"
            fi
            if ! grep -q "desugar_jdk_libs" "$BUILD_GRADLE"; then
              echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4' }" >> "$BUILD_GRADLE"
            fi
          fi

          flutter pub get

      - name: Release APK Derle
        run: flutter build apk --release

      - name: APK Dosyasini Hazirla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: yks-sayisal-takip-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
